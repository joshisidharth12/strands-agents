[project]
name = "my-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "joshisidharth12", email = "joshisidharth12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.106.6",
    "python-dotenv>=1.2.4",
    "strands-agents>=1.63.0",
]

[project.scripts]
my-agent = "agents:main"
file-manager = "agents:file_manager_agent"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["agents", "tools", "config"]

